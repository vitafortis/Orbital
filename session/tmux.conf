# Orbital draws its own chrome around the terminal, so tmux stays invisible.
set -g status off
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g escape-time 0
set -g history-limit 50000
# Several browsers can watch one session; size the window to whoever typed last.
set -g window-size latest
setw -g aggressive-resize on
# Wheel scrolls tmux history; hold Shift to select text in the browser.
set -g mouse on
# In tmux's history view the wheel moves one line per report; the browser sends one per
# line scrolled. Orbital's attach command sets the same (src/lib/server/terminal/upgrade.ts).
bind -T copy-mode WheelUpPane send -X -N 1 scroll-up
bind -T copy-mode WheelDownPane send -X -N 1 scroll-down
bind -T copy-mode M-WheelDownPane send -X cancel
bind -T copy-mode-vi WheelUpPane send -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send -X -N 1 scroll-down
bind -T copy-mode-vi M-WheelDownPane send -X cancel
# Copy (in tmux or Claude Code) reaches the browser clipboard over OSC 52. Right-click is
# the page's, to copy the selection where the browser refused it (no tmux menu).
unbind -n MouseDown3Pane
set -g set-clipboard on
set -g allow-passthrough on
set -g focus-events on
# Pass terminal hyperlinks (OSC 8) through, so they're clickable in the browser.
set -as terminal-features ",*:hyperlinks"
